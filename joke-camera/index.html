<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ジョーク測定カメラ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070a;
    --fg: #eef3f7;
    --dim: #8b98a5;
    --panel: rgba(10, 14, 20, .72);
    --line: rgba(255, 255, 255, .14);
    --accent: #3ee6a0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: "M PLUS 1 Code", system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; overflow: hidden; background: #000; }
  video, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  video { object-fit: cover; }
  video.mirror { transform: scaleX(-1); }

  /* 上の帯 */
  .top { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top) + 8px) 12px 8px;
    display: flex; flex-direction: column; gap: 8px; background: linear-gradient(#000c, #0000); z-index: 5; }
  .title { display: flex; align-items: baseline; gap: 8px; font-weight: 700; font-size: 15px; }
  .title .back { color: var(--dim); text-decoration: none; font-weight: 500; font-size: 13px; }
  .title .mini { margin-left: auto; border: 1px solid var(--line); background: var(--panel); color: var(--fg);
    border-radius: 999px; padding: 2px 10px; font: inherit; font-size: 11px; font-weight: 700; }
  .title .ver { color: #fff !important; font-size: 13px !important; font-weight: 700 !important;
    background: rgba(255,255,255,.16); border-radius: 6px; padding: 1px 7px;
  }
  .title .ver.latest { background: rgba(62,230,160,.3); }
  .title .ver-old { color: var(--dim); font-weight: 500; font-size: 11px; }
  .modes { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .modes::-webkit-scrollbar { display: none; }
  .modes button { flex: none; border: 1px solid var(--line); background: var(--panel); color: var(--fg);
    border-radius: 999px; padding: 7px 13px; font: inherit; font-size: 14px; font-weight: 700; }
  .modes button[aria-pressed="true"] { background: var(--c, var(--accent)); color: #000; border-color: transparent; }

  /* 下のボタン */
  .bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 20px calc(env(safe-area-inset-bottom) + 18px);
    display: flex; align-items: center; justify-content: space-between; background: linear-gradient(#0000, #000c); z-index: 5; }
  .round { width: 56px; height: 56px; line-height: 1.2; border-radius: 50%; border: 1px solid var(--line); background: var(--panel);
    color: var(--fg); font: inherit; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .shutter { width: 72px; height: 72px; border-radius: 50%; border: 4px solid #fff; background: rgba(255,255,255,.18); }
  .shutter:active { background: rgba(255,255,255,.5); }
  .note { font-size: 11px; color: var(--dim); text-shadow: 0 1px 3px #000; }
  #status { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 6; width: min(86vw, 360px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px 20px; text-align: center;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #status h2 { margin: 0 0 8px; font-size: 19px; }
  #status .startver { margin: -4px 0 10px; font-size: 14px; font-weight: 700; color: var(--accent); }
  #status p { margin: 0 0 16px; font-size: 13px; color: var(--dim); line-height: 1.6; }
  #status .err { color: #ff8a8a; }
  .primary { border: 0; border-radius: 12px; background: var(--accent); color: #000; font: inherit; font-weight: 700;
    font-size: 16px; padding: 13px 22px; width: 100%; }
  .primary:disabled { opacity: .5; }
  .hidden { display: none !important; }

  /* 撮った写真 */
  #shot { position: fixed; inset: 0; z-index: 10; background: #000e; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 20px; }
  #shot img { max-width: 100%; max-height: 72vh; border-radius: 10px; }
  #shot .row { display: flex; gap: 10px; width: min(100%, 420px); }
  #shot .row button, #shot .row a { flex: 1; text-align: center; text-decoration: none; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg); border-radius: 12px; padding: 12px; font: inherit; font-weight: 700; font-size: 15px; }
  #shot .row .primary { background: var(--accent); color: #000; border: 0; }
  #shot small { color: var(--dim); font-size: 12px; }

  #debug { position: fixed; left: 0; right: 0; top: 96px; max-height: 22vh; pointer-events: none; overflow: auto; z-index: 20;
    background: #000d; color: #9f9; font: 11px/1.4 monospace; padding: 6px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
</div>

<div class="top">
  <div class="title"><a class="back" href="../">← ツール一覧</a><span>ジョーク測定カメラ</span><button type="button" class="mini" id="people">記録 0人</button><span class="ver" id="ver"></span></div>
  <div class="modes" id="modes"></div>
  <div class="note">※ジョークです。数値はすべてでたらめです</div>
</div>


<div class="bottom">
  <button class="round" id="flip" type="button">切替</button>
  <button class="shutter" id="snap" type="button" aria-label="撮影"></button>
  <button class="round" id="reset" type="button">再<br>スキャン</button>
</div>

<div id="status">
  <h2>ジョーク測定カメラ</h2>
  <div class="startver" id="startVer"></div>
  <p>カメラに映った人の頭の上に、<br>でたらめな数値を表示します。<br>映像はどこにも送信しません。</p>
  <button class="primary" id="start" type="button">カメラを起動</button>
</div>

<div id="shot" class="hidden">
  <img id="shotImg" alt="撮影した写真">
  <div class="row">
    <button type="button" id="shotClose">閉じる</button>
    <a id="shotSave" download="measure.png">保存</a>
    <button type="button" id="shotShare" class="primary hidden">共有</button>
  </div>
  <small>保存できないときは、写真を長押しして保存してください</small>
</div>

<script type="module">
const VERSION = '4';
const verEl = document.getElementById('ver'), startVerEl = document.getElementById('startVer');
verEl.textContent = '版 ' + VERSION;
startVerEl.textContent = '版 ' + VERSION + '（最新か確認中…）';

// 古いページがブラウザに残っていたら、最新の版を読み込み直す
// （公開ページは10分ほど覚えられるため。同じ版へは1回だけ試して、何度も読み込み直さない）
(async () => {
  try {
    const r = await fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' });
    const latest = (await r.text()).match(/const VERSION = '([^']+)'/)?.[1];
    if (latest === VERSION) {
      verEl.textContent = '版 ' + VERSION + ' 最新'; verEl.classList.add('latest');
      startVerEl.textContent = '版 ' + VERSION + '（最新です）';
      return;
    }
    if (!latest) { startVerEl.textContent = '版 ' + VERSION; return; }
    let tried = null;
    try { tried = sessionStorage.getItem('joke-camera-reload'); } catch (e) {}
    if (tried === latest) { startVerEl.textContent = '版 ' + VERSION + '（最新は 版 ' + latest + '。少し待って開き直してください）'; return; }
    try { sessionStorage.setItem('joke-camera-reload', latest); } catch (e) {}
    const u = new URL(location.href); u.searchParams.set('v', latest);
    location.replace(u.href);
  } catch (e) { startVerEl.textContent = '版 ' + VERSION; /* 電波がないときなどは、そのまま使う */ }
})();

/* ---------- 調査用の記録（?debug） ---------- */
const DEBUG = new URLSearchParams(location.search).has('debug');
let debugEl = null;
function log(...a) {
  const s = new Date().toISOString().slice(11, 23) + ' ' + a.map(x => typeof x === 'string' ? x : JSON.stringify(x)).join(' ');
  console.log(s);
  if (!DEBUG) return;
  if (!debugEl) { debugEl = document.createElement('div'); debugEl.id = 'debug'; document.body.append(debugEl); }
  debugEl.textContent += s + '\n';
  debugEl.scrollTop = 1e9;
}
window.addEventListener('error', e => log('error', e.message));
window.addEventListener('unhandledrejection', e => log('reject', String(e.reason)));
log('start', navigator.userAgent);

/* ---------- 乱数のいろいろ ---------- */
const rnd = (a, b) => a + Math.random() * (b - a);
const logRnd = (a, b) => Math.exp(rnd(Math.log(a), Math.log(b)));
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const comma = n => Math.round(n).toLocaleString('ja-JP');

/* ---------- 測定の種類 ---------- */
// make(): 確定した値（表示用の文字）を作る / noise(): 測定中に流すでたらめな表示
// make(): 確定した値 { pre, num, unit, lv } を作る。lv は 0〜1（高いほど赤くなる）
// noise(): 測定中にパラパラ流すでたらめな数字
const clamp01 = v => Math.min(1, Math.max(0, v));
const MODES = [
  { id: 'power', name: '戦闘力', color: '#3ee6a0',
    make() {
      if (Math.random() < .03) return { num: '測定不能', lv: 1, v: 1e12 };
      const v = logRnd(3, 600000);
      return { num: comma(v), lv: clamp01(Math.log(v / 3) / Math.log(200000)), v };
    },
    noise: () => ({ num: comma(logRnd(3, 999999)) }) },
  { id: 'exp', name: '経験人数', color: '#ff7eb6',
    make() {
      const r = Math.random();
      if (r < .03) return { num: '999+', unit: '人', lv: 1, v: 1e6 };
      const v = r < .12 ? 0 : Math.floor(logRnd(1, 100));
      return { num: String(v), unit: '人', lv: clamp01(v / 50), v };
    },
    noise: () => ({ num: String(Math.floor(rnd(0, 99))), unit: '人' }) },
  { id: 'life', name: '残りの寿命', color: '#ffb347',
    make() {
      const r = Math.random();
      if (r < .04) { const d = Math.floor(rnd(1, 7)); return { pre: 'あと', num: String(d), unit: '日', lv: 1, v: d / 365 }; }
      if (r < .06) return { num: '∞', lv: 0, v: 1e6 };
      const v = Math.floor(rnd(3, 85));
      return { pre: 'あと', num: String(v), unit: '年', lv: clamp01(1 - v / 60), v };
    },
    noise: () => ({ pre: 'あと', num: String(Math.floor(rnd(0, 99))), unit: '年' }) },
  { id: 'money', name: '年収', color: '#ffe04a',
    make() {
      const man = logRnd(80, 300000);
      const lv = clamp01(Math.log(man / 80) / Math.log(3000 / 80));
      if (man >= 10000) return { num: (man / 10000).toFixed(1), unit: '億円', lv, v: man };
      return { num: comma(man), unit: '万円', lv, v: man };
    },
    noise: () => ({ num: comma(rnd(0, 9999)), unit: '万円' }) },
  { id: 'iq', name: 'IQ', color: '#6fc3ff',
    make() { const v = Math.max(40, Math.round(100 + gauss() * 22)); return { pre: 'IQ', num: String(v), lv: clamp01((v - 70) / 70), v }; },
    noise: () => ({ pre: 'IQ', num: String(Math.floor(rnd(40, 200))) }) },
  { id: 'mote', name: 'モテ度', color: '#d38cff',
    make() { const v = Math.floor(rnd(0, 101)); return { num: String(v), unit: '%', lv: v / 100, v }; },
    noise: () => ({ num: String(Math.floor(rnd(0, 101))), unit: '%' }) },
];
let mode = MODES[0];
const modesEl = document.getElementById('modes');
for (const m of MODES) {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = m.name; b.style.setProperty('--c', m.color);
  b.setAttribute('aria-pressed', m === mode);
  b.onclick = () => {
    mode = m;
    for (const x of modesEl.children) x.setAttribute('aria-pressed', x === b);
    // 種類を変えたら測り直しの演出をする（同じ人の値は種類ごとに覚えておく）
    for (const t of tracks) if (!valueOf(t, m.id)) t.measureStart = performance.now();
    log('mode', m.id);
  };
  modesEl.append(b);
}

/* ---------- カメラ ---------- */
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const ctx = overlay.getContext('2d');
const statusEl = document.getElementById('status');
let facing = 'environment';
let stream = null;

async function openCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  log('camera open', facing);
  stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } },
  });
  video.srcObject = stream;
  await video.play();
  const s = stream.getVideoTracks()[0].getSettings();
  // 前カメラは鏡のように左右反転して見せる
  const front = (s.facingMode || facing) === 'user';
  video.classList.toggle('mirror', front);
  log('camera ok', { w: video.videoWidth, h: video.videoHeight, facing: s.facingMode });
  tracks = [];
}

/* ---------- 顔の検出 ---------- */
let detector = null;
async function loadDetector() {
  const { FaceDetector, FilesetResolver } = await import('./lib/vision_bundle.mjs');
  const files = await FilesetResolver.forVisionTasks(new URL('./lib/wasm', location.href).href);
  const opts = d => ({
    baseOptions: { modelAssetPath: new URL('./lib/blaze_face_short_range.tflite', location.href).href, delegate: d },
    runningMode: 'VIDEO', minDetectionConfidence: 0.5,
  });
  try { detector = await FaceDetector.createFromOptions(files, opts('GPU')); log('detector GPU'); }
  catch (e) { log('GPU failed', String(e)); detector = await FaceDetector.createFromOptions(files, opts('CPU')); log('detector CPU'); }
}

/* ---------- 顔の見分け（前に測った人には同じ数値を出す） ---------- */
// SFace で顔の特徴を128個の数にし、このスマホの中だけに記録して照らし合わせる
const PEOPLE_KEY = 'joke-camera-people-v1';
const MAX_PEOPLE = 300;
const SAME_PERSON = 0.42;   // 似ている度合い（-1〜1）がこれ以上なら同じ人とみなす
const SAMPLES = 3;          // 何枚分の顔を平均してから照らし合わせるか
let people = [];
try { people = JSON.parse(localStorage.getItem(PEOPLE_KEY) || '[]'); } catch (e) { people = []; }
const peopleBtn = document.getElementById('people');
function savePeople() {
  if (people.length > MAX_PEOPLE) { people.sort((a, b) => b.last - a.last); people.length = MAX_PEOPLE; }
  try { localStorage.setItem(PEOPLE_KEY, JSON.stringify(people)); } catch (e) { log('save failed', String(e)); }
  peopleBtn.textContent = '記録 ' + people.length + '人';
}
peopleBtn.textContent = '記録 ' + people.length + '人';
peopleBtn.onclick = () => {
  if (!people.length) { alert('まだ記録はありません。\n測った人の顔の特徴と数値を、このスマホの中だけに記録します。'); return; }
  if (!confirm('これまでに測った ' + people.length + '人の記録を消しますか？\n（顔の特徴と数値。このスマホの中にだけ保存されています）')) return;
  people = []; savePeople();
  for (const t of tracks) { t.person = null; t.samples = []; t.values = {}; t.measureStart = performance.now(); }
  log('people cleared');
};

// 計算は別の作業場所（Worker）で行い、その間も画面が止まらないようにする
let recognizer = null, recognizing = false;
async function loadRecognizer() {
  const base = new URL('./lib/', location.href).href;
  const code = `
    importScripts(${JSON.stringify(base + 'ort.wasm.min.js')});
    ort.env.wasm.wasmPaths = ${JSON.stringify(base)};
    ort.env.wasm.numThreads = 1;
    let s = null;
    onmessage = async e => {
      try {
        if (e.data.type === 'load') {
          s = await ort.InferenceSession.create(e.data.model, { executionProviders: ['wasm'] });
          postMessage({ ok: true, info: s.inputNames.concat(s.outputNames) });
        } else {
          const out = await s.run({ [s.inputNames[0]]: new ort.Tensor('float32', e.data.input, [1, 3, 112, 112]) });
          postMessage({ ok: true, emb: out[s.outputNames[0]].data });
        }
      } catch (err) { postMessage({ ok: false, error: String(err) }); }
    };`;
  const w = new Worker(URL.createObjectURL(new Blob([code], { type: 'text/javascript' })));
  const call = msg => new Promise((ok, ng) => {
    w.onmessage = e => e.data.ok ? ok(e.data) : ng(new Error(e.data.error));
    w.onerror = e => ng(new Error(e.message || 'worker error'));
    w.postMessage(msg, msg.input ? [msg.input.buffer] : []);
  });
  const r = await call({ type: 'load', model: base + 'face_recognition_sface_2021dec_int8.onnx' });
  recognizer = { run: input => call({ type: 'run', input }) };
  log('recognizer ok', r.info);
}

// 目・鼻・口の位置を、SFace が学習したときの決まった位置（112×112）に合わせて切り出す
const ALIGN_DST = [[38.2946, 51.6963], [73.5318, 51.5014], [56.0252, 71.7366], [56.1396, 92.2848]];
const alignCanvas = document.createElement('canvas');
alignCanvas.width = alignCanvas.height = 112;
const alignCtx = alignCanvas.getContext('2d', { willReadFrequently: true });
function alignFace(kp) {
  const eyes = [kp[0], kp[1]].sort((a, b) => a[0] - b[0]);
  const src = [eyes[0], eyes[1], kp[2], kp[3]];
  // 回転・拡大・移動だけの変換を、4点がいちばん合うように求める
  const n = src.length;
  let sx = 0, sy = 0, dx = 0, dy = 0;
  for (let i = 0; i < n; i++) { sx += src[i][0]; sy += src[i][1]; dx += ALIGN_DST[i][0]; dy += ALIGN_DST[i][1]; }
  sx /= n; sy /= n; dx /= n; dy /= n;
  let num1 = 0, num2 = 0, den = 0;
  for (let i = 0; i < n; i++) {
    const x = src[i][0] - sx, y = src[i][1] - sy, u = ALIGN_DST[i][0] - dx, v = ALIGN_DST[i][1] - dy;
    num1 += x * u + y * v; num2 += x * v - y * u; den += x * x + y * y;
  }
  const a = num1 / den, b = num2 / den;
  alignCtx.setTransform(1, 0, 0, 1, 0, 0);
  alignCtx.fillStyle = '#000'; alignCtx.fillRect(0, 0, 112, 112);
  alignCtx.setTransform(a, b, -b, a, dx - (a * sx - b * sy), dy - (b * sx + a * sy));
  alignCtx.drawImage(video, 0, 0);
  const px = alignCtx.getImageData(0, 0, 112, 112).data;
  const input = new Float32Array(3 * 112 * 112);
  for (let i = 0, j = 0; i < 112 * 112; i++, j += 4) {
    input[i] = px[j]; input[i + 12544] = px[j + 1]; input[i + 25088] = px[j + 2];
  }
  return input;
}
const normalize = v => { let n = 0; for (const x of v) n += x * x; n = Math.sqrt(n) || 1; return v.map(x => x / n); };
const cosine = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * b[i]; return s; };

async function embed(kp) {
  const out = await recognizer.run(alignFace(kp));
  return normalize(Array.from(out.emb));
}

// 毎フレーム呼ぶ。まだ誰か分からない人の顔を1つずつ調べる
async function identifyStep(now) {
  if (!recognizer || recognizing) return;
  const t = tracks.find(t => !t.person && !t.gaveUp && t.kp && t.kpTime === now && t.kpW >= 28);
  if (!t) return;
  recognizing = true;
  try {
    const t0 = performance.now();
    t.samples.push(await embed(t.kp));
    if (DEBUG && t.samples.length === 1) log('embed ms', Math.round(performance.now() - t0));
    if (t.samples.length >= SAMPLES) assignPerson(t);
  } catch (e) { log('embed error', String(e)); t.gaveUp = true; }
  recognizing = false;
}

function assignPerson(t) {
  const mean = normalize(t.samples[0].map((_, i) => t.samples.reduce((s, e) => s + e[i], 0)));
  const busy = new Set(tracks.filter(o => o !== t && o.person).map(o => o.person));
  let best = null, bestSim = -1;
  for (const p of people) {
    if (busy.has(p)) continue;
    const sim = cosine(mean, p.e);
    if (sim > bestSim) { best = p; bestSim = sim; }
  }
  if (best && bestSim >= SAME_PERSON) {
    // 少しずつ特徴を更新して、向きや明るさの違いに強くする
    best.e = normalize(best.e.map((x, i) => x * .85 + mean[i] * .15));
    if (Date.now() - best.last > 60000) best.visits++; // 少し見失っただけなら数えない
    best.last = Date.now();
    t.person = best;
    log('same person', best.id, bestSim.toFixed(3));
  } else {
    const p = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), e: mean, vals: {}, visits: 1, last: Date.now() };
    // 記録の前に測り終わっていた値は引き継ぐ
    Object.assign(p.vals, t.values);
    people.push(p);
    t.person = p;
    log('new person', p.id, 'best', bestSim.toFixed(3));
  }
  t.person.e = t.person.e.map(x => Math.round(x * 1e4) / 1e4);
  savePeople();
}

/* ---------- 人ごとの追跡（画面に映っている間、同じ人を追いかける） ---------- */
let tracks = [];
let nextId = 1;
function updateTracks(boxes, now) {
  const used = new Set();
  for (const b of boxes) {
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    let best = null, bestD = Infinity;
    for (const t of tracks) {
      if (used.has(t)) continue;
      const d = Math.hypot(t.cx - cx, t.cy - cy);
      if (d < bestD && d < Math.max(t.w, b.w) * 0.9) { best = t; bestD = d; }
    }
    if (!best) {
      best = { id: nextId++, values: {}, measureStart: now, born: now, cx, cy, w: b.w, h: b.h, person: null, samples: [] };
      tracks.push(best);
      log('new face', best.id);
    }
    // 位置はなめらかに追いかける
    const k = 0.5;
    best.cx += (cx - best.cx) * k; best.cy += (cy - best.cy) * k;
    best.w += (b.w - best.w) * k; best.h += (b.h - best.h) * k;
    best.seen = now;
    if (b.kp) { best.kp = b.kp; best.kpW = b.w; best.kpTime = now; }
    used.add(best);
  }
  // しばらく見えない人は忘れる
  tracks = tracks.filter(t => now - t.seen < 2500);
}

const MEASURE_MS = 1600;
const ID_WAIT_MS = 5000; // 顔を見分けられないまま、これ以上たったら記録なしで数値を出す
const valueOf = (t, id) => t.person ? t.person.vals[id] : t.values[id];
function labelFor(t, now) {
  const el = now - t.measureStart;
  let v = valueOf(t, mode.id);
  if (!v) {
    const waiting = recognizer && !t.person && el < ID_WAIT_MS; // まだ誰か調べている
    if (el < MEASURE_MS || waiting) return { ...mode.noise(), measuring: true, p: Math.min(el / MEASURE_MS, .97) };
    v = mode.make();
    if (t.person) { t.person.vals[mode.id] = v; savePeople(); } else t.values[mode.id] = v;
  }
  return { ...v, sub: t.person ? badgeFor(t.person, mode.id) : '' };
}
// 記録の中で一番高い・低い人と、何回目の測定かを小さく出す
function badgeFor(person, id) {
  const vs = people.map(p => p.vals[id]?.v).filter(x => x !== undefined);
  const me = person.vals[id]?.v;
  if (vs.length >= 3 && me !== undefined) {
    if (me >= Math.max(...vs)) return '最高記録';
    if (me <= Math.min(...vs)) return '最低記録';
  }
  return person.visits > 1 ? person.visits + '回目' : '';
}
// 低い＝緑 → 黄 → 高い＝赤
const levelColor = lv => lv < .34 ? '#3dff3d' : lv < .67 ? '#ffee00' : '#ff2a2a';

/* ---------- 描画 ---------- */
// 映像の座標 → 表示している画面の座標（object-fit: cover と左右反転を考える）
function viewMap(W, H) {
  const vw = video.videoWidth, vh = video.videoHeight;
  const s = Math.max(W / vw, H / vh);
  const ox = (W - vw * s) / 2, oy = (H - vh * s) / 2;
  const mirror = video.classList.contains('mirror');
  return { s, map: (x, y) => [mirror ? W - (ox + x * s) : ox + x * s, oy + y * s] };
}

function drawLabels(c, W, H, mapper, scale, now, minTop) {
  const unit = Math.min(W, H);
  for (const t of tracks) {
    if (now - t.seen > 900) continue; // 一瞬見失っただけなら表示は残す
    const [cx, cy] = mapper.map(t.cx, t.cy);
    if (cx < 0 || cx > W || cy < 0 || cy > H) continue; // 画面からはみ出た人は出さない
    const w = t.w * mapper.s * 1.15, h = t.h * mapper.s * 1.25;
    const lab = labelFor(t, now);

    // 顔の四隅の白いかぎ
    const x0 = cx - w / 2, y0 = cy - h / 2 - h * .06, L = Math.max(8, w * .2);
    c.strokeStyle = '#fff'; c.lineWidth = Math.max(2, w * .025); c.lineCap = 'square';
    c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 4;
    c.globalAlpha = lab.measuring ? .45 + .55 * Math.abs(Math.sin(now / 90)) : 1;
    c.beginPath();
    for (const [px, py, dx, dy] of [[x0, y0, 1, 1], [x0 + w, y0, -1, 1], [x0, y0 + h, 1, -1], [x0 + w, y0 + h, -1, -1]]) {
      c.moveTo(px, py + dy * L); c.lineTo(px, py); c.lineTo(px + dx * L, py);
    }
    c.stroke();
    c.globalAlpha = 1; c.shadowBlur = 0;

    // 頭の上の大きな数字（低い＝緑・中＝黄・高い＝赤）
    const fs = Math.min(Math.max(w * .42, unit * .06), unit * .16);
    const small = fs * .62;
    const color = lab.measuring ? '#ffffff' : levelColor(lab.lv ?? 0);
    const parts = [[lab.pre, small], [lab.num, fs], [lab.unit, small]].filter(p => p[0]);
    let total = 0;
    for (const p of parts) { c.font = `900 ${p[1]}px "M PLUS 1 Code", sans-serif`; p.push(c.measureText(p[0]).width); total += p[2]; }
    let x = Math.min(Math.max(cx - total / 2, 4), W - total - 4);
    const base = Math.max(y0 - fs * .25, minTop + fs * (lab.sub ? 1.3 : .9));
    if (lab.sub && !lab.measuring) {
      const bs = fs * .36;
      c.font = `900 ${bs}px "M PLUS 1 Code", sans-serif`; c.textAlign = 'center'; c.lineJoin = 'round';
      c.lineWidth = bs * .25; c.strokeStyle = 'rgba(0,0,0,.85)';
      const by = base - fs * .95, bx = Math.min(Math.max(cx, total / 2 + 4), W - total / 2 - 4);
      c.strokeText(lab.sub, bx, by);
      c.fillStyle = lab.sub.startsWith('最') ? '#ffd23f' : '#fff'; c.fillText(lab.sub, bx, by);
    }
    c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.lineJoin = 'round';
    for (const [text, size, tw] of parts) {
      c.font = `900 ${size}px "M PLUS 1 Code", sans-serif`;
      c.lineWidth = size * .16; c.strokeStyle = 'rgba(0,0,0,.85)';
      c.strokeText(text, x, base);
      c.fillStyle = color; c.fillText(text, x, base);
      x += tw;
    }
  }
}

// 下の「〇〇をスキャン中…」の帯（参考画像のような表示）
function drawScanBar(c, W, H, now, bottomOffset) {
  const visible = tracks.filter(t => now - t.seen <= 900);
  let p = 1, measuring = false;
  for (const t of visible) {
    if (!valueOf(t, mode.id)) { measuring = true; p = Math.min(p, (now - t.measureStart) / MEASURE_MS); }
  }
  const fs = Math.max(13, Math.min(W, H) * .032);
  const x = 14, y = H - bottomOffset - fs * 2.6;
  const msg = !visible.length ? '人をさがしています…' : measuring ? mode.name + 'をスキャン中…' : mode.name + 'のスキャン完了（' + visible.length + '人）';
  c.font = `700 ${fs}px "M PLUS 1 Code", sans-serif`;
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  c.lineWidth = 4; c.strokeStyle = 'rgba(0,0,0,.6)'; c.lineJoin = 'round';
  c.strokeText(msg, x, y); c.fillStyle = '#fff'; c.fillText(msg, x, y);
  const bw = Math.min(W * .5, fs * 16), bh = fs * .55, by = y + fs * .5;
  c.fillStyle = 'rgba(255,255,255,.35)'; roundRect(c, x, by, bw, bh, bh / 2); c.fill();
  const prog = !visible.length ? (now / 1500) % 1 : p;
  c.fillStyle = mode.color; roundRect(c, x, by, Math.max(bh, bw * prog), bh, bh / 2); c.fill();
}

// 左上の日時
function drawClock(c, top) {
  const d = new Date(), z = n => String(n).padStart(2, '0');
  const s = `${d.getMonth() + 1}/${d.getDate()} ${z(d.getHours())}:${z(d.getMinutes())}`;
  c.font = '700 15px "M PLUS 1 Code", sans-serif'; c.textAlign = 'left'; c.textBaseline = 'top';
  c.lineWidth = 4; c.strokeStyle = 'rgba(0,0,0,.6)'; c.strokeText(s, 12, top); c.fillStyle = '#fff'; c.fillText(s, 12, top);
}
function roundRect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

// 顔を見つける部品は小さい顔が苦手なので、映像全体に加えて、区切った一部分を
// 毎回ひとつずつ順番に拡大して調べる（離れた人や大人数でも見つかるように）
function makeTiles(vw, vh) {
  const tiles = [];
  for (const size of [Math.min(vw, vh), Math.min(vw, vh) / 2]) {
    const nx = Math.max(1, Math.ceil(vw / size * 1.5 - .5)), ny = Math.max(1, Math.ceil(vh / size * 1.5 - .5));
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
      tiles.push({ x: nx === 1 ? (vw - size) / 2 : (vw - size) * i / (nx - 1),
                   y: ny === 1 ? (vh - size) / 2 : (vh - size) * j / (ny - 1), size });
    }
  }
  return tiles;
}
const tileCanvas = document.createElement('canvas');
tileCanvas.width = tileCanvas.height = 256;
const tileCtx = tileCanvas.getContext('2d', { willReadFrequently: true });
let tiles = [], tilesKey = '', tileIndex = 0, detectTs = 0;

// kw, kh: 目印（0〜1 の割合）を画素に直すための、調べた画像の幅と高さ
const toBox = (d, ox, oy, k, kw, kh) => ({
  x: ox + d.boundingBox.originX * k, y: oy + d.boundingBox.originY * k,
  w: d.boundingBox.width * k, h: d.boundingBox.height * k, score: d.categories?.[0]?.score ?? 0,
  kp: d.keypoints?.length >= 4 ? d.keypoints.slice(0, 4).map(p => [ox + p.x * kw, oy + p.y * kh]) : null,
});
function overlaps(a, b) {
  const ix = Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x));
  const iy = Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));
  return ix * iy > 0.3 * Math.min(a.w * a.h, b.w * b.h);
}

function detectFaces() {
  const vw = video.videoWidth, vh = video.videoHeight;
  const key = vw + 'x' + vh;
  if (key !== tilesKey) { tiles = makeTiles(vw, vh); tilesKey = key; tileIndex = 0; log('tiles', tiles.length); }
  const boxes = detector.detectForVideo(video, ++detectTs).detections.map(d => toBox(d, 0, 0, 1, vw, vh));
  if (tiles.length) {
    const t = tiles[tileIndex++ % tiles.length];
    tileCtx.drawImage(video, t.x, t.y, t.size, t.size, 0, 0, 256, 256);
    const k = t.size / 256;
    for (const d of detector.detectForVideo(tileCanvas, ++detectTs).detections) {
      const b = toBox(d, t.x, t.y, k, t.size, t.size);
      // 区切りの端で切れた顔は使わない
      if (b.x - t.x < 2 || b.y - t.y < 2 || t.x + t.size - b.x - b.w < 2 || t.y + t.size - b.y - b.h < 2) continue;
      if (!boxes.some(o => overlaps(o, b))) boxes.push(b);
    }
  }
  return boxes;
}

let lastVideoTime = -1;
function loop() {
  requestAnimationFrame(loop);
  if (!video.videoWidth) return;
  const now = performance.now();
  if (detector && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    try { updateTracks(detectFaces(), now); identifyStep(now); }
    catch (e) { log('detect error', String(e)); }
  }
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const W = overlay.clientWidth, H = overlay.clientHeight;
  if (overlay.width !== Math.round(W * dpr) || overlay.height !== Math.round(H * dpr)) {
    overlay.width = Math.round(W * dpr); overlay.height = Math.round(H * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const topH = document.querySelector('.top').offsetHeight, bottomH = document.querySelector('.bottom').offsetHeight;
  drawLabels(ctx, W, H, viewMap(W, H), 1, now, topH);
  drawScanBar(ctx, W, H, now, bottomH);
}

/* ---------- 撮影 ---------- */
const shot = document.getElementById('shot');
let shotBlob = null;
document.getElementById('snap').onclick = async () => {
  if (!video.videoWidth) return;
  // 画面に見えている範囲をそのまま写真にする
  const W = overlay.clientWidth, H = overlay.clientHeight;
  const k = 2;
  const cv = document.createElement('canvas');
  cv.width = Math.round(W * k); cv.height = Math.round(H * k);
  const c = cv.getContext('2d');
  c.scale(k, k);
  const m = viewMap(W, H);
  const vw = video.videoWidth * m.s, vh = video.videoHeight * m.s;
  c.save();
  if (video.classList.contains('mirror')) { c.translate(W, 0); c.scale(-1, 1); }
  c.drawImage(video, (W - vw) / 2, (H - vh) / 2, vw, vh);
  c.restore();
  drawLabels(c, W, H, m, 1, performance.now(), 30);
  drawClock(c, 10);
  c.font = '500 11px "M PLUS 1 Code", sans-serif'; c.textAlign = 'right'; c.fillStyle = 'rgba(255,255,255,.7)';
  c.fillText('※ジョークです', W - 8, H - 8);
  shotBlob = await new Promise(r => cv.toBlob(r, 'image/png'));
  const url = URL.createObjectURL(shotBlob);
  document.getElementById('shotImg').src = url;
  const a = document.getElementById('shotSave');
  a.href = url; a.download = 'measure-' + Date.now() + '.png';
  const file = new File([shotBlob], a.download, { type: 'image/png' });
  document.getElementById('shotShare').classList.toggle('hidden', !(navigator.canShare && navigator.canShare({ files: [file] })));
  shot.classList.remove('hidden');
  log('snap', cv.width + 'x' + cv.height);
};
document.getElementById('shotClose').onclick = () => shot.classList.add('hidden');
document.getElementById('shotShare').onclick = async () => {
  const a = document.getElementById('shotSave');
  try { await navigator.share({ files: [new File([shotBlob], a.download, { type: 'image/png' })] }); }
  catch (e) { log('share', String(e)); }
};

/* ---------- ボタン ---------- */
document.getElementById('flip').onclick = async () => {
  facing = facing === 'user' ? 'environment' : 'user';
  try { await openCamera(); } catch (e) { log('flip failed', String(e)); }
};
document.getElementById('reset').onclick = () => { tracks = []; log('reset'); };

document.getElementById('start').onclick = async () => {
  const btn = document.getElementById('start');
  const p = statusEl.querySelector('p');
  btn.disabled = true;
  if (!navigator.mediaDevices?.getUserMedia) {
    p.innerHTML = '<span class="err">このブラウザではカメラを使えません。<br>Chrome か Safari で、https のページとして開いてください。</span>';
    btn.disabled = false; return;
  }
  try {
    btn.textContent = 'カメラを起動中…';
    await openCamera();
  } catch (e) {
    log('camera error', e.name, e.message);
    p.innerHTML = '<span class="err">カメラを開けませんでした（' + e.name + '）。<br>カメラの使用を「許可」してから、もう一度押してください。</span>';
    btn.textContent = 'もう一度'; btn.disabled = false; return;
  }
  statusEl.classList.add('hidden');
  requestAnimationFrame(loop);
  try { await loadDetector(); }
  catch (e) {
    log('detector error', String(e));
    statusEl.classList.remove('hidden');
    statusEl.innerHTML = '<p class="err">顔を見つける部品を読み込めませんでした。<br>電波のよい所で開き直してください。</p>';
    return;
  }
  // 顔を見分ける部品は失敗しても、記録なし（毎回ちがう数値）で動かす
  try { await loadRecognizer(); }
  catch (e) { log('recognizer error', String(e)); }
};
</script>
