<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>slimewaka tools</title>
<meta name="description" content="ブラウザだけで動く、インストール不要の小さな道具たち。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* レイアウト: 1カラムの一覧。各ツールは横長の行で、名前・説明・対応形式を並べる */
:root {
  --bg: #e9ecef;
  --panel: #fbfbfc;
  --ink: #1c2228;
  --muted: #5b6671;
  --line: #d3d9de;
  --accent: #2a57c0;
  --accent-soft: #dfe7fa;
  --sans: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181c; --panel: #1e2227; --ink: #e5e8eb; --muted: #98a2ac; --line: #343a42;
    --accent: #84a6ff; --accent-soft: #24304a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15181c; --panel: #1e2227; --ink: #e5e8eb; --muted: #98a2ac; --line: #343a42;
  --accent: #84a6ff; --accent-soft: #24304a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.7 var(--sans); }
.wrap { max-width: 760px; margin: 0 auto; padding: 56px 16px 64px; display: flex; flex-direction: column; gap: 32px; }
header { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font: 500 12px var(--mono); letter-spacing: .1em; color: var(--muted); margin: 0; }
h1 { font-size: 28px; margin: 0; letter-spacing: .03em; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); max-width: 60ch; }
ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
a.tool {
  display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: center;
  padding: 18px 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  color: inherit; text-decoration: none;
}
a.tool:hover { border-color: var(--accent); }
a.tool:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.name { font-size: 18px; font-weight: 700; }
.desc { grid-column: 1; color: var(--muted); font-size: 14px; min-width: 0; }
.go { grid-row: 1 / span 3; grid-column: 2; color: var(--accent); font-weight: 700; white-space: nowrap; }
.tags { grid-column: 1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.tags span { font: 500 11px var(--mono); padding: 1px 7px; border-radius: 4px; background: var(--accent-soft); color: var(--ink); }
footer { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
@media (max-width: 480px) {
  .wrap { padding-top: 32px; }
  a.tool { grid-template-columns: 1fr; }
  .go { grid-row: auto; grid-column: 1; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">slimewaka / tools</p>
    <h1>ツール置き場</h1>
    <p class="lead">ブラウザで開くだけで使える、インストール不要の道具です。画像などのデータは外部に送信されず、すべて手元のブラウザ内で処理されます。</p>
  </header>

  <ul>
    <li>
      <a class="tool" href="bg-remover/">
        <span class="name">背景透過ツール</span>
        <span class="desc">画像の背景を消して透明にし、透過を保ったまま保存します。自動削除・範囲クリック・消しゴムで調整できます。<br>大きい画像は自動で縮小して読み込みます（スマホ約600万画素・パソコン約1600万画素まで）。</span>
        <span class="tags"><span>PNG</span><span>BMP 32bit</span><span>TGA</span><span>WebP</span><span>ICO</span></span>
        <span class="go">開く →</span>
      </a>
    </li>
  </ul>

  <footer>推奨ブラウザ: Chrome / Edge の最新版</footer>
</div>
</body>
</html>
